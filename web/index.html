<div id="login" class="login" hidden>
  <form id="login-form" class="login-card">
    <img class="login-mark" src="/icon.svg" alt="" width="48" height="48">
    <h1 data-i18n="Sign in to open-mem">Sign in to open-mem</h1>
    <p class="muted" data-i18n="Paste the admin token printed when the plugin was installed.">Paste the admin token printed when the plugin was installed.</p>
    <label class="field-label" for="token" data-i18n="Admin token">Admin token</label>
    <input id="token" name="token" type="password" autocomplete="current-password" spellcheck="false" required placeholder="om_admin_…">
    <button type="submit" class="btn primary" data-i18n="Log in">Log in</button>
    <p id="login-error" class="form-error" role="alert"></p>
    <p class="hint" data-i18n-html="Lost it? Run &lt;code&gt;token reset&lt;/code&gt; with the open-mem CLI on the machine that holds the database.">Lost it? Run <code>token reset</code> with the open-mem CLI on the machine that holds the database.</p>
    <div class="prefs"><select data-pref="lang" data-i18n-aria="Language" aria-label="Language"></select><select data-pref="theme" data-i18n-aria="Theme" aria-label="Theme"></select></div>
  </form>
</div>

<div id="app" class="shell" hidden>
  <nav id="side" class="side" aria-label="Sections" data-i18n-aria="Sections">
    <a class="brand" href="#/overview"><img src="/icon.svg" alt="" width="28" height="28"><span>open-mem</span></a>
    <ul class="nav">
      <li><a href="#/overview" data-nav="overview"><svg class="i" aria-hidden="true"><use href="#i-progress"/></svg><span data-i18n="Progress">Progress</span></a></li>

      <li><a href="#/timeline" data-nav="timeline"><svg class="i" aria-hidden="true"><use href="#i-timeline"/></svg><span data-i18n="Timeline">Timeline</span></a></li>
      <li><a href="#/sessions" data-nav="sessions"><svg class="i" aria-hidden="true"><use href="#i-sessions"/></svg><span data-i18n="Sessions">Sessions</span></a></li>
      <li><a href="#/tasks" data-nav="tasks"><svg class="i" aria-hidden="true"><use href="#i-tasks"/></svg><span data-i18n="Tasks">Tasks</span></a></li>
      <li><a href="#/notes" data-nav="notes"><svg class="i" aria-hidden="true"><use href="#i-notes"/></svg><span data-i18n="Notes">Notes</span></a></li>
      <li><a href="#/search" data-nav="search"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg><span data-i18n="Search">Search</span></a></li>
      <li><a href="#/llm" data-nav="llm"><svg class="i" aria-hidden="true"><use href="#i-chip"/></svg><span data-i18n="Local LLM">Local LLM</span></a></li>
    </ul>
    <div class="side-foot">
      <div class="prefs"><select data-pref="lang" data-i18n-aria="Language" aria-label="Language"></select><select data-pref="theme" data-i18n-aria="Theme" aria-label="Theme"></select></div>
      <button id="logout" class="btn ghost small" type="button"><svg class="i" aria-hidden="true"><use href="#i-logout"/></svg><span data-i18n="Log out">Log out</span></button>
      <p class="version" id="version"></p>
    </div>
  </nav>
  <div id="scrim" class="scrim" hidden></div>
  <header class="topbar">
    <button id="menu" class="icon-btn menu-btn" type="button" aria-controls="side" aria-expanded="false" aria-label="Menu" data-i18n-aria="Menu"><svg class="i" aria-hidden="true"><use href="#i-menu"/></svg></button>
    <a class="brand topbar-brand" href="#/overview"><img src="/icon.svg" alt="" width="24" height="24"><span>open-mem</span></a>
    <form id="omni" class="omni" role="search">
      <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="omni-input" type="search" name="q" autocomplete="off" spellcheck="false" placeholder="Search memory" data-i18n-placeholder="Search memory" aria-label="Search memory" data-i18n-aria="Search memory">
      <kbd aria-hidden="true">/</kbd>
    </form>
  </header>
  <main id="view" tabindex="-1"></main>
</div>

<dialog id="drawer" class="drawer" aria-labelledby="drawer-title">
  <header class="drawer-head">
    <p id="drawer-title" class="drawer-ref"></p>
    <button id="drawer-copy" class="icon-btn" type="button" aria-label="Copy reference" data-i18n-aria="Copy reference" hidden><svg class="i" aria-hidden="true"><use href="#i-copy"/></svg></button>
    <button id="drawer-close" class="icon-btn" type="button" aria-label="Close" data-i18n-aria="Close"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>
  </header>
  <div id="drawer-body" class="drawer-body"></div>
