<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>open-mem</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<script src="/app.js" type="module"></script>
</head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form" class="login-card">
    <h1 class="wordmark">open-mem</h1>
    <p data-i18n="Paste the admin token printed when the plugin was installed.">Paste the admin token printed when the plugin was installed.</p>
    <label for="token" data-i18n="Admin token">Admin token</label>
    <input id="token" name="token" type="password" autocomplete="current-password" spellcheck="false" required placeholder="om_admin_…">
    <button type="submit" data-i18n="Log in">Log in</button>
    <p id="login-error" class="error" role="alert"></p>
    <p class="hint" data-i18n-html="Lost it? Run &lt;code&gt;token reset&lt;/code&gt; with the open-mem CLI on the machine that holds the database.">Lost it? Run <code>token reset</code> with the open-mem CLI on the machine that holds the database.</p>
    <div class="prefs"><select data-pref="lang" data-i18n-aria="Language" aria-label="Language"></select><select data-pref="theme" data-i18n-aria="Theme" aria-label="Theme"></select></div>
  </form>
</div>

<div id="app" class="app" hidden>
  <nav class="rail" aria-label="Sections" data-i18n-aria="Sections">
    <a class="wordmark" href="#/overview">open-mem</a>
    <ul>
      <li><a href="#/overview" data-nav="overview" data-i18n="Progress">Progress</a></li>
      <li><a href="#/projects" data-nav="projects" data-i18n="Projects">Projects</a></li>
      <li><a href="#/timeline" data-nav="timeline" data-i18n="Timeline">Timeline</a></li>
      <li><a href="#/tasks" data-nav="tasks" data-i18n="Tasks">Tasks</a></li>
      <li><a href="#/notes" data-nav="notes" data-i18n="Notes">Notes</a></li>
      <li><a href="#/search" data-nav="search" data-i18n="Search">Search</a></li>
      <li><a href="#/sessions" data-nav="sessions" data-i18n="Sessions">Sessions</a></li>
    </ul>
    <div class="prefs"><select data-pref="lang" data-i18n-aria="Language" aria-label="Language"></select><select data-pref="theme" data-i18n-aria="Theme" aria-label="Theme"></select></div>
    <button id="logout" class="link" data-i18n="Log out">Log out</button>
  </nav>
  <main id="view" tabindex="-1"></main>
</div>

<aside id="drawer" class="drawer" hidden aria-label="Record detail" data-i18n-aria="Record detail">
  <button id="drawer-close" class="drawer-close" aria-label="Close" data-i18n-aria="Close">×</button>
  <div id="drawer-body"></div>
</aside>
</body>
</html>
